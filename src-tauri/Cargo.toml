[package]
name = "portwhim"
version = "0.1.0"
description = "Local ports and processes"
authors = ["Portwhim contributors"]
edition = "2021"
default-run = "portwhim"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
netstat2 = "0.11"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
